# One-file configuration for the Isaac Sim fabric simulation with the
# sensitivity CBF filtering the two follower grippers.
#
#   ros2 launch fabric_sim_bringup full_sim.launch.py [headless:=true] [dry_run:=true]
#
# Relative paths are resolved against the repository root (the directory that
# contains fabric_newton_isaacsim.py). With `colcon build --symlink-install`,
# edits to this file take effect without rebuilding.

launch:
  start_isaac: true
  start_teleop: true
  teleop_start_delay: 0.0      # s
  shutdown_on_isaac_exit: true # stop teleop when the simulator window closes

isaac_sim:
  # Isaac Sim's python.sh. The ISAAC_PYTHON_SH environment variable and the
  # isaac_python launch argument override it. working_directory defaults to
  # the directory of python.sh.
  python_sh: /media/taha/ExtermeLinux/isaacsim6.2/python.sh
  script: fabric_newton_isaacsim.py

  # Simulator flags (`python.sh fabric_newton_isaacsim.py --help`):
  # cloth_start_z -> --cloth-start-z 1.05; true/false keys are switches.
  arguments:
    grid_x: 56
    grid_y: 56
    cell_x: 0.015
    cell_y: 0.015
    cloth_center_x: 0.0
    cloth_center_y: 0.0
    cloth_start_z: 1.05        # room for start-up sag above the capsule envelope
    cloth_material: dry_carbon_twill  # appearance; legacy_red restores the old solid color
    yarn_pitch: 0.002          # m between yarns; 2x2 twill repeats every four yarns
    areal_density: 0.2         # kg/m^2: nominal 200 gsm dry carbon; calibration pending
    particle_radius: 0.008
    table_hx: 0.22             # the CBF capsule is built from these half extents
    table_hy: 0.22
    table_hz: 0.16
    gripper_size: 3
    gripper_inset: 0.05        # m toward the center in x and y before frame 0 (cloth sags)
    substeps: 8
    iterations: 10
    linear_iterations: 16
    state_publish_every: 3
    # Existing uncalibrated Style3D mechanics, retained until real-material tests.
    tri_ke_weft: 30000.0
    tri_ke_warp: 30000.0
    tri_ke_shear: 6000.0
    tri_ka: 5000.0
    tri_kd: 0.00005
    edge_ke_weft: 0.002
    edge_ke_warp: 0.001
    edge_ke_shear: 0.0005
    edge_kd: 0.00001
    contact_radius: 0.01
    contact_margin: 0.012
    contact_ke: 4000.0
    contact_kd: 0.01
    contact_mu: 2.0
    ros_frame_id: world
    cmd_timeout: 1.0
    disable_cuda_graph: false
    headless: false

  # Raw extra arguments appended to the simulator command (e.g. Kit flags).
  extra_args: []

cbf:
  # Sensitivity CBF settings; every key is documented in capsule_cbf/settings.py.
  config: capsule_cbf/config.json
  # Per-launch overrides of that JSON, e.g. {controller: none} to run unfiltered.
  overrides: {}

teleop:
  parameters:
    linear_speed: 0.10
    publish_rate: 30.0
    frame_id: world
