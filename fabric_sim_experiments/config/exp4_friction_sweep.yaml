# Experiment 4 — Friction sweep (qualitative, screenshots)
#
# Independent variable: contact_mu ∈ {0.05, 0.2, 0.5, 1.0, 2.0, 4.0}
# Deliverable: per-value leader/follower CSVs + manual screenshots.
# The runner prints a prominent banner at start and end of each mu value.
#
# Screenshots should be taken at:
#   t = 0%, 25%, 50%, 75%, 100% of the +y approach to the stop target.

exp_name: exp4_friction_sweep
n_repeats: 1

isaac_sim:
  working_directory: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release
  python_sh: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release/python.sh
  script: /home/taha/ros2_colcon_ws/src/fabric_sim_isaacsim_newton/fabric_newton_isaacsim_standalone.py
  arguments:
    grid_x: 56
    grid_y: 56
    cell_x: 0.015
    cell_y: 0.015
    cloth_start_z: 0.45
    cloth_start_x: 0.0
    cloth_start_y: -0.75
    mass_per_particle: 0.003
    particle_radius: 0.008
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    gripper_size: 3
    substeps: 8
    iterations: 10
    linear_iterations: 16
    state_publish_every: 3
    tri_ke_weft: 30000.0
    tri_ke_warp: 30000.0
    tri_ke_shear: 6000.0
    tri_ka: 5000.0
    tri_kd: 0.00005
    edge_ke_weft: 0.002
    edge_ke_warp: 0.001
    edge_ke_shear: 0.0005
    edge_kd: 0.00001
    contact_radius: 0.01
    contact_margin: 0.012
    contact_ke: 4000.0
    contact_kd: 0.01
    contact_mu: 2.0          # overridden per cell
    ros_frame_id: world
    cmd_timeout: 1.0
    follower_command_max_speed: 0.0
    follower_start_y_offset: 0.1
    disable_cuda_graph: false
    external_cbf_enabled: true
    cbf_command_timeout: 0.10
    cbf_stale_policy: nominal

obstacle_distance:
  parameters:
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    particle_radius: 0.008
    safety_margin: 0.05

cbf_controller:
  parameters:
    enabled: false
    control_rate_hz: 60.0
    activation_distance: 0.05
    alpha_gain_near: 5.0
    alpha_gain_far: 1.0
    max_speed: 0.20
    jacobian_mode: normal_equal
    formation_recovery_enabled: true
    formation_recovery_gain: 0.5
    publish_debug: true
    stretch_enabled: true

sweep:
  - mu_tag: "0.05"
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      contact_mu: 0.05

  - mu_tag: "0.50"
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      contact_mu: 0.50

  - mu_tag: "1.00"
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      contact_mu: 1.00

  - mu_tag: "4.00"
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      contact_mu: 4.00
