# Experiment 4 — contact friction sweep (simulator study, CBF off).
#
# The cloth starts beside the table (center y = -0.75 m, z = 0.45 m) and the
# leaders drag it across the table top at 0.05 m/s for 1.4 m. The cloth must
# touch the table, i.e. enter the capsule envelope, so the run is unfiltered
# (controller: none); clearance and tension are still recorded.
# Windowed: the runner prints a banner per value for manual screenshots.
#
# Feeds: per-run CSVs and manual viewport screenshots.

exp_name: exp4_friction_sweep
n_repeats: 1
base_config: fabric_sim_bringup/config/full_sim.yaml

isaac_args:
  cloth_center_y: -0.75
  cloth_start_z: 0.45
cbf_overrides: {controller: none}

sweep:
  - {mu_tag: "0.05", banner: "EXP4 contact_mu = 0.05", leader_velocity: [0.0, 0.05, 0.0],
     leader_motion_distance: 1.4, leader_start_delay: 1.0, isaac_args: {contact_mu: 0.05}}
  - {mu_tag: "0.50", banner: "EXP4 contact_mu = 0.50", leader_velocity: [0.0, 0.05, 0.0],
     leader_motion_distance: 1.4, leader_start_delay: 1.0, isaac_args: {contact_mu: 0.50}}
  - {mu_tag: "1.00", banner: "EXP4 contact_mu = 1.00", leader_velocity: [0.0, 0.05, 0.0],
     leader_motion_distance: 1.4, leader_start_delay: 1.0, isaac_args: {contact_mu: 1.00}}
  - {mu_tag: "4.00", banner: "EXP4 contact_mu = 4.00", leader_velocity: [0.0, 0.05, 0.0],
     leader_motion_distance: 1.4, leader_start_delay: 1.0, isaac_args: {contact_mu: 4.00}}
