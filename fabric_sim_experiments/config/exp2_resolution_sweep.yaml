# Experiment 2 — Execution time vs fabric resolution
#
# Independent variable: (grid_x, grid_y) at 4 levels.
# Physical cloth size is held constant at 56×56 × 0.015 m = 0.84 m × 0.84 m
# so cell size = 0.84 / grid_x for each resolution.
#
# Feeds: fig_simulation_performance_vs_cloth_resolution.png

exp_name: exp2_resolution_sweep
n_repeats: 1           # one run per resolution

_cloth_size: &cloth_size 0.84   # metres (fixed)

_base_isaac: &base_isaac
  working_directory: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release
  python_sh: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release/python.sh
  script: /home/taha/ros2_colcon_ws/src/fabric_sim_isaacsim_newton/fabric_newton_isaacsim_standalone.py
  arguments:
    cloth_start_z: 0.60
    cloth_start_x: 0.0
    cloth_start_y: -0.75
    mass_per_particle: 0.003
    particle_radius: 0.008
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    gripper_size: 3
    substeps: 8
    iterations: 10
    linear_iterations: 16
    state_publish_every: 1     # publish every frame for accurate timing
    tri_ke_weft: 30000.0
    tri_ke_warp: 30000.0
    tri_ke_shear: 6000.0
    tri_ka: 5000.0
    tri_kd: 0.00005
    edge_ke_weft: 0.002
    edge_ke_warp: 0.001
    edge_ke_shear: 0.0005
    edge_kd: 0.00001
    contact_radius: 0.01
    contact_margin: 0.012
    contact_ke: 4000.0
    contact_kd: 0.01
    contact_mu: 2.0
    ros_frame_id: world
    cmd_timeout: 1.0
    follower_command_max_speed: 0.0
    follower_start_y_offset: 0.1
    disable_cuda_graph: false
    external_cbf_enabled: true
    cbf_command_timeout: 0.10
    cbf_stale_policy: nominal

isaac_sim: *base_isaac

obstacle_distance:
  parameters:
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    particle_radius: 0.008
    safety_margin: 0.05

cbf_controller:
  parameters:
    enabled: true
    control_rate_hz: 60.0
    activation_distance: 0.05
    alpha_gain_near: 5.0
    alpha_gain_far: 1.0
    max_speed: 0.20
    jacobian_mode: normal_equal
    formation_recovery_enabled: true
    formation_recovery_gain: 0.5
    publish_debug: true
    stretch_enabled: true

sweep:
  - resolution_tag: "20x20"
    n_particles: 441       # (20+1)^2
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      grid_x: 20
      grid_y: 20
      cell_x: 0.042          # 0.84 / 20
      cell_y: 0.042

  - resolution_tag: "56x56"
    n_particles: 3249      # (56+1)^2
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      grid_x: 56
      grid_y: 56
      cell_x: 0.015          # 0.84 / 56
      cell_y: 0.015

  - resolution_tag: "72x72"
    n_particles: 5329
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      grid_x: 72
      grid_y: 72
      cell_x: 0.01167        # 0.84 / 72
      cell_y: 0.01167

  - resolution_tag: "128x128"
    n_particles: 16641
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      grid_x: 128
      grid_y: 128
      cell_x: 0.0065625      # 0.84 / 128
      cell_y: 0.0065625
