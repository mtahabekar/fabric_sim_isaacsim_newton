# Experiment 2 — simulation rate vs cloth resolution, sensitivity CBF in the loop.
#
# The cloth size is fixed at 0.84 m x 0.84 m (cell = 0.84 / grid). Scenario as
# in Exp. 1 (`descend`). Run headless for clean timing:
#   ros2 run fabric_sim_experiments batch_runner --ros-args -p config:=<this file> -p headless:=true
#
# Feeds: fig_simulation_performance_vs_cloth_resolution.

exp_name: exp2_resolution_sweep
n_repeats: 1
base_config: fabric_sim_bringup/config/full_sim.yaml

isaac_args:
  cloth_start_z: 0.85
cbf_overrides: {controller: sensitivity}

sweep:
  - resolution_tag: "20x20"
    n_particles: 441
    leader_velocity: [0.0, 0.0, -0.10]
    leader_motion_distance: 0.33
    leader_start_delay: 1.0
    isaac_args: {grid_x: 20, grid_y: 20, cell_x: 0.042, cell_y: 0.042}

  - resolution_tag: "56x56"
    n_particles: 3249
    leader_velocity: [0.0, 0.0, -0.10]
    leader_motion_distance: 0.33
    leader_start_delay: 1.0
    isaac_args: {grid_x: 56, grid_y: 56, cell_x: 0.015, cell_y: 0.015}

  - resolution_tag: "72x72"
    n_particles: 5329
    leader_velocity: [0.0, 0.0, -0.10]
    leader_motion_distance: 0.33
    leader_start_delay: 1.0
    isaac_args: {grid_x: 72, grid_y: 72, cell_x: 0.0116667, cell_y: 0.0116667}

  - resolution_tag: "128x128"
    n_particles: 16641
    leader_velocity: [0.0, 0.0, -0.10]
    leader_motion_distance: 0.33
    leader_start_delay: 1.0
    isaac_args: {grid_x: 128, grid_y: 128, cell_x: 0.0065625, cell_y: 0.0065625}
