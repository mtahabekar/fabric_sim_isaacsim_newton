# Experiment 5 — material stiffness sweep (simulator study, CBF off).
#
# Same drag-over-the-table scenario as Exp. 4 with low / mid (default) / high
# stretch and bending stiffness. Unfiltered for the reason given in Exp. 4.
# tri_ka, tri_kd and edge_kd are not read by Newton 1.2.1's Style3D solver.
# Windowed: the runner prints a banner per preset for manual screenshots.

exp_name: exp5_stiffness_sweep
n_repeats: 1
base_config: fabric_sim_bringup/config/full_sim.yaml

isaac_args:
  cloth_center_y: -0.75
  cloth_start_z: 0.50
cbf_overrides: {controller: none}

sweep:
  - stiffness_tag: low
    banner: "EXP5 stiffness = low"
    leader_velocity: [0.0, 0.05, 0.0]
    leader_motion_distance: 1.4
    leader_start_delay: 1.0
    isaac_args: {tri_ke_weft: 3000.0, tri_ke_warp: 3000.0, tri_ke_shear: 600.0,
                 edge_ke_weft: 0.0002, edge_ke_warp: 0.0001, edge_ke_shear: 0.00005}

  - stiffness_tag: mid
    banner: "EXP5 stiffness = mid"
    leader_velocity: [0.0, 0.05, 0.0]
    leader_motion_distance: 1.4
    leader_start_delay: 1.0
    isaac_args: {tri_ke_weft: 30000.0, tri_ke_warp: 30000.0, tri_ke_shear: 6000.0,
                 edge_ke_weft: 0.002, edge_ke_warp: 0.001, edge_ke_shear: 0.0005}

  - stiffness_tag: high
    banner: "EXP5 stiffness = high"
    leader_velocity: [0.0, 0.05, 0.0]
    leader_motion_distance: 1.4
    leader_start_delay: 1.0
    isaac_args: {tri_ke_weft: 300000.0, tri_ke_warp: 300000.0, tri_ke_shear: 60000.0,
                 edge_ke_weft: 0.02, edge_ke_warp: 0.01, edge_ke_shear: 0.005}
