# Experiment 3 — leader speed vs capsule clearance with the sensitivity CBF.
#
# Scenario `descend` (Exp. 1) at increasing leader speeds; the 0.33 s
# prediction horizon must absorb faster approaches. One unfiltered baseline.
#
# Feeds: fig_speed_min_distance_traces.

exp_name: exp3_leader_speed_sweep
n_repeats: 1
base_config: fabric_sim_bringup/config/full_sim.yaml

isaac_args:
  cloth_start_z: 0.85
cbf_overrides: {}

sweep:
  - {speed_tag: "0.05", cbf_on: true, leader_velocity: [0.0, 0.0, -0.05], leader_motion_distance: 0.33,
     leader_start_delay: 1.0, cbf_params: {controller: sensitivity}}
  - {speed_tag: "0.10", cbf_on: true, leader_velocity: [0.0, 0.0, -0.10], leader_motion_distance: 0.33,
     leader_start_delay: 1.0, cbf_params: {controller: sensitivity}}
  - {speed_tag: "0.20", cbf_on: true, leader_velocity: [0.0, 0.0, -0.20], leader_motion_distance: 0.33,
     leader_start_delay: 1.0, cbf_params: {controller: sensitivity}}
  - {speed_tag: "0.40", cbf_on: true, leader_velocity: [0.0, 0.0, -0.40], leader_motion_distance: 0.33,
     leader_start_delay: 1.0, cbf_params: {controller: sensitivity}}
  - {speed_tag: "0.10", cbf_on: false, leader_velocity: [0.0, 0.0, -0.10], leader_motion_distance: 0.33,
     leader_start_delay: 1.0, cbf_params: {controller: none}}
