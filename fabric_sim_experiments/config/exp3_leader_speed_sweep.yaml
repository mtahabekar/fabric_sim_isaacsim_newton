# Experiment 3 — Leader-speed sweep (does CBF keep up?)
#
# Independent variable: leader_speed_y from 0.02 to 0.20 m/s.
# At high speeds the CBF is expected to lag; the global min of min_distance
# will drop toward or below the safety margin.
# Also includes a CBF-off baseline at 0.02 m/s.
#
# Feeds: fig_speed_min_distance_traces.png

exp_name: exp3_leader_speed_sweep
n_repeats: 1

isaac_sim:
  working_directory: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release
  python_sh: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release/python.sh
  script: /home/taha/ros2_colcon_ws/src/fabric_sim_isaacsim_newton/fabric_newton_isaacsim_standalone.py
  arguments:
    grid_x: 56
    grid_y: 56
    cell_x: 0.015
    cell_y: 0.015
    cloth_start_z: 0.50
    cloth_start_x: 0.0
    cloth_start_y: -0.75
    mass_per_particle: 0.003
    particle_radius: 0.008
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    gripper_size: 3
    substeps: 8
    iterations: 10
    linear_iterations: 16
    state_publish_every: 3
    tri_ke_weft: 30000.0
    tri_ke_warp: 30000.0
    tri_ke_shear: 6000.0
    tri_ka: 5000.0
    tri_kd: 0.00005
    edge_ke_weft: 0.002
    edge_ke_warp: 0.001
    edge_ke_shear: 0.0005
    edge_kd: 0.00001
    contact_radius: 0.01
    contact_margin: 0.012
    contact_ke: 4000.0
    contact_kd: 0.01
    contact_mu: 2.0
    ros_frame_id: world
    cmd_timeout: 1.0
    follower_command_max_speed: 0.0
    follower_start_y_offset: 0.1
    disable_cuda_graph: false
    cbf_command_timeout: 0.10
    cbf_stale_policy: nominal

obstacle_distance:
  parameters:
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    particle_radius: 0.008
    safety_margin: 0.05

cbf_controller:
  parameters:
    enabled: true
    control_rate_hz: 60.0
    activation_distance: 0.05
    alpha_gain_near: 5.0
    alpha_gain_far: 1.0
    max_speed: 4.0       # raised ceiling so fast leaders can be followed
    jacobian_mode: normal_equal
    formation_recovery_enabled: true
    formation_recovery_gain: 0.5
    publish_debug: true
    stretch_enabled: true

sweep:

  - speed_tag: "0.10"
    leader_speed_y: 0.10
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      external_cbf_enabled: true
    cbf_params:
      enabled: true

  - speed_tag: "0.40"
    leader_speed_y: 0.40
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      external_cbf_enabled: true
    cbf_params:
      enabled: true

  - speed_tag: "1.0"
    leader_speed_y: 1.00
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      external_cbf_enabled: true
    cbf_params:
      enabled: true
