# Experiment 1 — sensitivity CBF on vs off (corner trajectories, capsule clearance).
#
# Scenario `descend`: the cloth hangs at z = 0.85 m and both leaders descend at
# 0.10 m/s for 0.33 m (to z = 0.52 m, just above the capsule top at 0.51 m),
# pulling the cloth onto the capsule that encloses the table. Descending
# further makes clearance and the stretch limits physically incompatible;
# stretch has priority, so the cloth then enters the margin (relaxed_hard). CBF on: followers receive the filtered command. CBF off
# (controller: none): followers receive the same nominal formation command
# unfiltered; clearance and tension are still measured and recorded.
#
# Feeds: fig_traj3d_descend, fig_min_distance_descend.

exp_name: exp1_cbf_on_off
n_repeats: 1
base_config: fabric_sim_bringup/config/full_sim.yaml   # simulator + CBF defaults

isaac_args:          # overrides of isaac_sim.arguments for every cell
  cloth_start_z: 0.85
cbf_overrides: {}    # overrides of the CBF JSON for every cell

sweep:
  - scenario: descend
    cbf_on: true
    leader_velocity: [0.0, 0.0, -0.10]
    leader_motion_distance: 0.33
    leader_start_delay: 1.0
    cbf_params: {controller: sensitivity}

  - scenario: descend
    cbf_on: false
    leader_velocity: [0.0, 0.0, -0.10]
    leader_motion_distance: 0.33
    leader_start_delay: 1.0
    cbf_params: {controller: none}
