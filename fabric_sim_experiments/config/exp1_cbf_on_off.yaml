# Experiment 1 — Trajectory comparison: CBF on vs off (3D corner trajectories)
#
# Independent variable: external_cbf_enabled ∈ {true, false}
# Fabric starts at center=(0.0, -0.55, 0.40), below the table in y.
# Leaders drive in +y until every corner reaches the table +y edge plus 0.05 m.
#
# Feeds: fig_traj3d_*.png and fig_min_distance_*.png
# Analogue: Aksoy & Wen ICRA 2024, Fig. 8–9.

exp_name: exp1_cbf_on_off
n_repeats: 1

# Shared IsaacSim + ROS configuration (same for every cell)
isaac_sim:
  working_directory: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release
  python_sh: /home/taha/isaacsim6_new/IsaacSim/_build/linux-x86_64/release/python.sh
  script: /home/taha/ros2_colcon_ws/src/fabric_sim_isaacsim_newton/fabric_newton_isaacsim_standalone.py
  arguments:
    grid_x: 56
    grid_y: 56
    cell_x: 0.015
    cell_y: 0.015
    cloth_start_z: 0.50
    cloth_start_x: 0.0
    cloth_start_y: -0.75
    mass_per_particle: 0.003
    particle_radius: 0.008
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    gripper_size: 3
    substeps: 8
    iterations: 10
    linear_iterations: 16
    state_publish_every: 3
    tri_ke_weft: 30000.0
    tri_ke_warp: 30000.0
    tri_ke_shear: 6000.0
    tri_ka: 5000.0
    tri_kd: 0.00005
    edge_ke_weft: 0.002
    edge_ke_warp: 0.001
    edge_ke_shear: 0.0005
    edge_kd: 0.00001
    contact_radius: 0.01
    contact_margin: 0.012
    contact_ke: 4000.0
    contact_kd: 0.01
    contact_mu: 2.0
    ros_frame_id: world
    cmd_timeout: 1.0
    follower_command_max_speed: 0.0
    follower_start_y_offset: 0.1
    disable_cuda_graph: false
    external_cbf_enabled: true  # overridden per cell below
    cbf_command_timeout: 0.10
    cbf_stale_policy: nominal

obstacle_distance:
  parameters:
    fabric_state_topic: /fabric/sim/state
    distance_topic: /fabric/obstacle_distance
    obstacle_id: table
    table_center_x: 0.0
    table_center_y: 0.0
    table_hx: 0.22
    table_hy: 0.22
    table_hz: 0.16
    particle_radius: 0.008
    safety_margin: 0.05
    publish_debug_log: false

cbf_controller:
  parameters:
    enabled: true
    control_rate_hz: 60.0
    frame_id: world
    leader_left_cbf_input_topic: /fabric/leader_left/cbf_input_cmd_vel
    leader_right_cbf_input_topic: /fabric/leader_right/cbf_input_cmd_vel
    obstacle_distance_topic: /fabric/obstacle_distance
    fabric_corners_topic: /fabric/sim/corners
    follower_left_cbf_topic: /fabric/follower_left/cbf_cmd_vel
    follower_right_cbf_topic: /fabric/follower_right/cbf_cmd_vel
    debug_topic: /fabric/cbf/debug
    input_timeout: 0.25
    distance_timeout: 0.25
    corners_timeout: 0.50
    activation_distance: 0.05
    alpha_gain_near: 5.0
    alpha_gain_far: 1.0
    alpha_switch_h: 0.05
    max_speed: 0.20
    output_filter_beta: 0.0
    weight_x: 1.0
    weight_y: 1.0
    weight_z: 1.0
    jacobian_mode: normal_equal
    min_jacobian_norm: 0.000001
    cloth_half_width_x: 0.42
    left_right_weight_power: 1.0
    min_corner_weight: 0.0
    formation_recovery_enabled: true
    formation_recovery_gain: 0.5
    formation_recovery_max_speed: 0.1
    formation_recovery_deadband: 0.003
    formation_reference_mode: initial
    stale_policy: nominal
    infeasible_policy: project_bounds
    publish_debug: true
    debug_log_enabled: false
    stretch_enabled: true
    stretch_alpha_gain: 1.0
    stretch_velocity_filter_beta: 0.8
    d_max_bl_tl: 0.85
    d_max_br_tr: 0.85
    d_max_bl_br: 0.85

# Sweep: CBF on vs off from the shared +y approach spawn.
sweep:
  - cbf_on: true
    cloth_start_z_tag: "0.50"
    cloth_start_y_tag: "-0.75"
    leader_speed_y: 0.05
    leader_motion_distance: 1.6
    leader_start_delay: 2.0
    isaac_args:
      cloth_start_z: 0.50
      cloth_start_x: 0.0
      cloth_start_y: -0.75
      external_cbf_enabled: true
    cbf_params:
      enabled: true

  - cbf_on: false
    cloth_start_z_tag: "0.50"
    cloth_start_y_tag: "-0.75"
    leader_speed_y: 0.05
    leader_motion_distance: 1.4
    leader_start_delay: 2.0
    isaac_args:
      cloth_start_z: 0.50
      cloth_start_x: 0.0
      cloth_start_y: -0.75
      external_cbf_enabled: false
    cbf_params:
      enabled: false
